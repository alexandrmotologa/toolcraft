openapi: "3.0.3"
info:
  title: "Petstore Service API"
  description: "Enterprise Petstore microservice providing pet lifecycle, inventory, and order operations."
  version: "1.0.0"
servers:
  - url: "https://api.petstore.example.com/v1"
    description: "Production API Gateway"
paths:
  /pets:
    get:
      summary: "List all pets"
      description: "Returns a paginated list of pets with optional status filtering."
      operationId: "listPets"
      parameters:
        - name: "status"
          in: "query"
          description: "Status filter for pet availability"
          required: false
          schema:
            type: "string"
            enum: ["available", "pending", "sold"]
        - name: "limit"
          in: "query"
          description: "Maximum number of pets to return"
          required: false
          schema:
            type: "integer"
            default: 20
        - name: "X-Trace-ID"
          in: "header"
          description: "Internal tracing identifier"
          required: false
          schema:
            type: "string"
        - name: "internal_shard_hint"
          in: "query"
          description: "Database partitioning shard hint"
          required: false
          schema:
            type: "integer"
      responses:
        "200":
          description: "A paged array of pets"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      summary: "Create a pet"
      description: "Adds a new pet record to the catalog."
      operationId: "createPet"
      parameters:
        - name: "X-Debug-Mode"
          in: "header"
          required: false
          schema:
            type: "boolean"
      requestBody:
        description: "Pet to add to the store"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: "Pet created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{petId}:
    get:
      summary: "Get pet by ID"
      description: "Retrieves complete details for a specific pet."
      operationId: "getPetById"
      parameters:
        - name: "petId"
          in: "path"
          required: true
          description: "The unique identifier of the pet"
          schema:
            type: "string"
        - name: "legacy_format"
          in: "query"
          description: "Legacy format flag"
          required: false
          schema:
            type: "boolean"
      responses:
        "200":
          description: "Expected response to a valid request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: "Pet not found"
    delete:
      summary: "Delete a pet"
      description: "Removes a pet record from the catalog."
      operationId: "deletePet"
      parameters:
        - name: "petId"
          in: "path"
          required: true
          description: "The pet identifier to delete"
          schema:
            type: "string"
      responses:
        "204":
          description: "Pet successfully deleted"

  /orders:
    post:
      summary: "Place an order"
      description: "Places a purchase order for a pet."
      operationId: "placeOrder"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Order"
      responses:
        "200":
          description: "Order placed successfully"

components:
  schemas:
    Pet:
      type: "object"
      required:
        - "id"
        - "name"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        tag:
          type: "string"
        status:
          type: "string"
    NewPet:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
        tag:
          type: "string"
    Order:
      type: "object"
      required:
        - "petId"
        - "quantity"
      properties:
        id:
          type: "string"
        petId:
          type: "string"
        quantity:
          type: "integer"
        status:
          type: "string"
          enum: ["placed", "approved", "delivered"]
